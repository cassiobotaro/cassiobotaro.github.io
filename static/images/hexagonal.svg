  <g stroke="#241348" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <path d="M1128 166 V232 A62 20 0 0 0 1252 232 V166 Z" fill="#7fb3ff"/>
    <ellipse cx="1190" cy="166" rx="62" ry="20" fill="#a8ccff"/>
    <path d="M1128 199 A62 20 0 0 0 1252 199" fill="none" stroke-width="5"/>
  </g>

  <!-- arquivo -->
  <g stroke="#241348" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <path d="M1135 318 H1225 L1255 348 V426 H1135 Z" fill="#ffffff"/>
    <path d="M1225 318 V348 H1255" fill="#cfc7e8" stroke-width="5"/>
    <rect x="1155" y="368" width="76" height="9" rx="4.5" fill="#7fb3ff" stroke="none"/>
    <rect x="1155" y="390" width="56" height="9" rx="4.5" fill="#a8ccff" stroke="none"/>
  </g>

  <!-- chip de memoria -->
  <g stroke="#241348" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <g fill="#cfc7e8" stroke-width="5">
      <rect x="1124" y="509" width="20" height="12" rx="4"/>
      <rect x="1124" y="539" width="20" height="12" rx="4"/>
      <rect x="1124" y="569" width="20" height="12" rx="4"/>
      <rect x="1236" y="509" width="20" height="12" rx="4"/>
      <rect x="1236" y="539" width="20" height="12" rx="4"/>
      <rect x="1236" y="569" width="20" height="12" rx="4"/>
    </g>
    <rect x="1140" y="495" width="100" height="100" rx="12" fill="#ff9f68"/>
    <rect x="1162" y="517" width="56" height="56" rx="8" fill="#ffd166" stroke-width="5"/>
  </g>

  <!-- ================= O HEXAGONO ================= -->
  <path d="M704 197 L856 285 L856 460 L704 547 L552 460 L552 285 Z"
        fill="#8fe6c4" stroke="#241348" stroke-width="9" stroke-linejoin="round"/>


  <!-- ================= PORTAS (tomadas na borda) ================= -->
  <g stroke="#241348" stroke-width="6">
    <circle cx="552" cy="312" r="21" fill="#2a1a55"/>
    <circle cx="552" cy="372" r="21" fill="#2a1a55"/>
    <circle cx="552" cy="432" r="21" fill="#2a1a55"/>
    <circle cx="856" cy="312" r="21" fill="#2a1a55"/>
    <circle cx="856" cy="372" r="21" fill="#2a1a55"/>
    <circle cx="856" cy="432" r="21" fill="#2a1a55"/>
  </g>

  <!-- ================= ADAPTADORES ================= -->
  <use href="#adapter" transform="translate(552 312)" color="#ffd166"/>
  <use href="#adapter" transform="translate(552 372)" color="#ff9f68"/>
  <use href="#adapter" transform="translate(552 432)" color="#ff8fab"/>
  <use href="#adapter" transform="translate(856 312) scale(-1 1)" color="#7fe3c0"/>
  <use href="#adapter" transform="translate(856 372) scale(-1 1)" color="#7fb3ff"/>
  <use href="#adapter" transform="translate(856 432) scale(-1 1)" color="#c9a2ff"/>

  <!-- assinatura -->
  <use href="#sparkle" transform="translate(1332 700) scale(28)" fill="#ffffff" opacity="0.85"/>
</svg>
